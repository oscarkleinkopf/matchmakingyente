[build]
  command = "npm install && mkdir -p dist && cp index.html style.css app.js audio.js dist/ && cp -r assets dist/"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "."
